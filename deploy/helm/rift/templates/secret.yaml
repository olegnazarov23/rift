{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rift.fullname" . }}
  labels:
    {{- include "rift.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials.backendAccessKey }}
  RIFT_BACKEND_ACCESS_KEY: {{ . | quote }}
  RIFT_BACKEND_SECRET_KEY: {{ required "credentials.backendSecretKey" $.Values.credentials.backendSecretKey | quote }}
  {{- end }}
  RIFT_CLIENT_ACCESS_KEY: {{ required "credentials.clientAccessKey" .Values.credentials.clientAccessKey | quote }}
  RIFT_CLIENT_SECRET_KEY: {{ required "credentials.clientSecretKey" .Values.credentials.clientSecretKey | quote }}
{{- end }}
