apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rift.fullname" . }}
  labels:
    {{- include "rift.labels" . | nindent 4 }}
spec:
  # the compactor: one per bucket (it holds .rift/compactor; another would only stand by). It also
  # serves when serve.replicas is 0.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rift.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rift.selector" . | nindent 8 }}
        app.kubernetes.io/component: compactor
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
        {{- if .Values.metrics.prometheusAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /-/metrics
        prometheus.io/port: "9100"
        {{- end }}
    spec:
      serviceAccountName: {{ include "rift.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # lets rift read the IRSA token and write its volumes
        fsGroup: 65532
      containers:
        - name: rift
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "rift.servingArgs" . | nindent 12 }}
            - --cold-after={{ .Values.compaction.coldAfter }}
            - --min-size-mb={{ .Values.compaction.minSizeMB }}
            - --pack-level={{ .Values.compaction.packLevel }}
            - --max-unpacked-mb={{ .Values.compaction.maxUnpackedMB }}
            - --gc-grace={{ .Values.gc.grace }}
            - --gc-rewrite-below={{ .Values.gc.rewriteBelow }}
            - --state-dir=/var/lib/rift
          envFrom:
            - secretRef:
                name: {{ include "rift.secret" . }}
          ports:
            - name: s3
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /-/healthz
              port: s3
              scheme: {{ if .Values.tls.secretName }}HTTPS{{ else }}HTTP{{ end }}
          livenessProbe:
            httpGet:
              path: /-/healthz
              port: s3
              scheme: {{ if .Values.tls.secretName }}HTTPS{{ else }}HTTP{{ end }}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/rift
            {{- if .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/rift/tls
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        - name: state
          {{- if .Values.state.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rift.fullname" . }}-state
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.state.size }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
