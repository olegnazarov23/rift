image:
  # published for amd64 and arm64 from this repo's version tags
  repository: ghcr.io/olegnazarov23/rift
  tag: "0.1.1"
  pullPolicy: IfNotPresent

# The bucket your registry stores in today. rift keeps everything in it, under .rift/.
backend:
  endpoint: https://s3.us-east-1.amazonaws.com
  bucket: my-registry
  region: us-east-1
  # The backend as clients reach it. Set it if the registry redirects blob downloads to storage:
  # blobs stored as they are then go straight to S3 and only cold ones stream through rift.
  redirectEndpoint: ""

# Keys: "client" is what the registry signs with when it talks to rift (required). "backend" lets
# rift read and write the bucket; leave it empty to use an IAM role instead (see serviceAccount).
# Use an existing Secret with RIFT_CLIENT_ACCESS_KEY and RIFT_CLIENT_SECRET_KEY (and optionally
# RIFT_BACKEND_ACCESS_KEY and RIFT_BACKEND_SECRET_KEY), or fill these in.
credentials:
  existingSecret: ""
  backendAccessKey: ""
  backendSecretKey: ""
  clientAccessKey: ""
  clientSecretKey: ""

compaction:
  # compact blobs nobody has written or read for this long
  coldAfter: 7d
  # each round lists the bucket: one LIST request per 1,000 objects
  interval: 1h
  minSizeMB: 1
  packLevel: 19
  # put a blob's original bytes back after a cold read, until it goes cold again
  hotCopy: true

gc:
  # how long a pack no blob uses stays readable before it's deleted
  grace: 10m
  rewriteBelow: 0.5

# On EKS, give rift an IAM role instead of backend keys: annotate for IRSA
# (eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/rift) or add a Pod Identity association
# for this service account.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Cold reads rebuild on these cores; compaction uses them too.
threads: ""
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 8Gi

# Past these, clients get 413 or 503 SlowDown (registries and S3 clients retry 503s).
limits:
  # largest request body; registries upload blobs in parts far smaller
  maxBodyMB: 1024
  maxRequests: 512
  # rebuilds at once (each on `threads` cores); more wait up to a minute
  maxColdReads: 4
  # temp disk for rebuilt blobs waiting on slow clients: keep it under tmp.sizeLimit
  maxSpillGB: 16

# Serve HTTPS from a kubernetes.io/tls Secret (kubectl create secret tls rift-tls --cert=… --key=…);
# then the registry uses https://<service>:9100 with secure: true.
tls:
  secretName: ""

# Cold reads are rebuilt into files here while clients download them, and hot copies are made from
# them: size it for your largest layers times concurrent cold pulls, above limits.maxSpillGB.
tmp:
  sizeLimit: 20Gi

# The chunk index (about 60 bytes per stored chunk). It's rebuilt from the bucket when lost, so an
# emptyDir works; a persistent volume saves the rebuild on restarts of a large registry.
state:
  size: 10Gi
  persistence:
    enabled: false
    storageClass: ""

service:
  type: ClusterIP
  port: 9100

# Prometheus metrics are served at /-/metrics on the same port.
metrics:
  prometheusAnnotations: true

nodeSelector: {}
tolerations: []
affinity: {}
