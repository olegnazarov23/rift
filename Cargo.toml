[package]
name = "rift"
version = "0.1.5"
edition = "2024"
description = "Byte-exact recompression for container registries and object storage"
license = "Apache-2.0"
repository = "https://github.com/olegnazarov23/rift"
readme = "README.md"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fastcdc = "3"
hmac = "0.12"
httpdate = "1"
lepton_jpeg = "0.5.8"
preflate-rs = { path = "vendor/preflate-rs" }
redb = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = { path = "vendor/tiny_http", features = ["ssl-rustls"] }
zstd = "0.13"

[dev-dependencies]
flate2 = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
lto = "fat"
codegen-units = 1
